<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Moovit – Transit App</title>
  <link rel="stylesheet" href="styles.css" />
  <!-- Leaflet map -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- Material Icons -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>

<!-- ═══════════════════════════ TOP BAR ═══════════════════════════ -->
<header class="top-bar">
  <div class="logo">
    <span class="logo-icon">M</span>
    <span class="logo-text">moovit</span>
  </div>
  <div class="top-actions">
    <button class="icon-btn" title="Notifications"><span class="material-icons">notifications_none</span></button>
    <div class="avatar">JD</div>
  </div>
</header>

<!-- ═══════════════════════════ SEARCH PANEL ═══════════════════════ -->
<div class="search-panel" id="searchPanel">
  <div class="search-fields">
    <div class="search-row">
      <span class="dot dot-blue"></span>
      <input type="text" id="fromInput" class="search-input" placeholder="From: Current Location" value="Times Square, New York" />
      <button class="icon-btn small" onclick="locateMe()"><span class="material-icons">my_location</span></button>
    </div>
    <div class="search-divider">
      <div class="divider-line"></div>
      <button class="swap-btn" onclick="swapLocations()" title="Swap"><span class="material-icons">swap_vert</span></button>
    </div>
    <div class="search-row">
      <span class="dot dot-red"></span>
      <input type="text" id="toInput" class="search-input" placeholder="Where to?" value="Brooklyn Bridge, New York" />
      <button class="icon-btn small" id="clearTo" onclick="clearDestination()"><span class="material-icons">close</span></button>
    </div>
  </div>

  <div class="filter-row">
    <button class="filter-chip active" data-mode="all" onclick="filterRoutes(this, 'all')">
      <span class="material-icons">directions</span> All
    </button>
    <button class="filter-chip" data-mode="bus" onclick="filterRoutes(this, 'bus')">
      <span class="material-icons">directions_bus</span> Bus
    </button>
    <button class="filter-chip" data-mode="subway" onclick="filterRoutes(this, 'subway')">
      <span class="material-icons">directions_subway</span> Subway
    </button>
    <button class="filter-chip" data-mode="walk" onclick="filterRoutes(this, 'walk')">
      <span class="material-icons">directions_walk</span> Walk
    </button>
    <button class="filter-chip" data-mode="bike" onclick="filterRoutes(this, 'bike')">
      <span class="material-icons">directions_bike</span> Bike
    </button>
  </div>

  <button class="search-btn" onclick="searchRoutes()">
    <span class="material-icons">search</span> Get Directions
  </button>
</div>

<!-- ═══════════════════════════ MAP ════════════════════════════════ -->
<div id="map"></div>

<!-- ══════════════════════════ RESULTS PANEL ══════════════════════ -->
<div class="results-panel" id="resultsPanel">
  <div class="results-handle" onclick="toggleResults()"></div>

  <div class="results-header">
    <div>
      <div class="results-title">Best routes</div>
      <div class="results-meta">
        <span class="material-icons small-icon">access_time</span>
        Depart now · <span id="currentTime"></span>
      </div>
    </div>
    <button class="icon-btn" onclick="toggleResults()">
      <span class="material-icons" id="panelArrow">expand_more</span>
    </button>
  </div>

  <div class="routes-list" id="routesList"></div>
</div>

<!-- ══════════════════════════ BOTTOM NAV ═════════════════════════ -->
<nav class="bottom-nav">
  <button class="nav-item active" onclick="setNav(this, 'map')">
    <span class="material-icons">map</span>
    <span>Map</span>
  </button>
  <button class="nav-item" onclick="setNav(this, 'lines')">
    <span class="material-icons">directions_transit</span>
    <span>Lines</span>
  </button>
  <button class="nav-item" onclick="setNav(this, 'favorites')">
    <span class="material-icons">star_border</span>
    <span>Favorites</span>
  </button>
  <button class="nav-item" onclick="setNav(this, 'alerts')">
    <span class="material-icons">warning_amber</span>
    <span>Alerts</span>
  </button>
  <button class="nav-item" onclick="setNav(this, 'more')">
    <span class="material-icons">menu</span>
    <span>More</span>
  </button>
</nav>

<!-- ══════════════════════════ ROUTE DETAIL MODAL ════════════════ -->
<div class="modal-overlay" id="routeModal" onclick="closeModal(event)">
  <div class="modal-card" id="modalCard">
    <div class="modal-header">
      <h2 id="modalTitle">Route Details</h2>
      <button class="icon-btn" onclick="closeModal()"><span class="material-icons">close</span></button>
    </div>
    <div id="modalBody"></div>
    <div class="modal-footer">
      <button class="go-btn" onclick="startNavigation()">
        <span class="material-icons">navigation</span> Start Navigation
      </button>
    </div>
  </div>
</div>

<!-- ══════════════════════════ STOP POPUP ════════════════════════ -->
<div class="stop-popup" id="stopPopup">
  <div class="stop-popup-header">
    <span class="material-icons">directions_bus</span>
    <div>
      <div class="stop-name" id="stopName">34 St – Penn Station</div>
      <div class="stop-meta">Bus Stop · Next arrivals</div>
    </div>
    <button class="icon-btn small" onclick="closeStopPopup()"><span class="material-icons">close</span></button>
  </div>
  <div class="arrivals-list" id="arrivalsList"></div>
</div>

<script src="app.js"></script>
</body>
</html>
