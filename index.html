<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>מוביט – אפליקציית תחבורה</title>
  <link rel="stylesheet" href="styles.css" />
  <!-- Leaflet map -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- Material Icons -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>

<!-- ═══════════════════════════ TOP BAR ═══════════════════════════ -->
<header class="top-bar">
  <div class="logo">
    <span class="logo-icon">מ</span>
    <span class="logo-text">מוביט</span>
  </div>
  <div class="top-actions">
    <button class="icon-btn" title="התראות"><span class="material-icons">notifications_none</span></button>
    <div class="avatar">משה</div>
  </div>
</header>

<!-- ═══════════════════════════ SEARCH PANEL ═══════════════════════ -->
<div class="search-panel" id="searchPanel">
  <div class="search-fields">
    <div class="search-row" id="fromRow">
      <span class="dot dot-blue"></span>
      <input type="text" id="fromInput" class="search-input" placeholder="מאיפה? הזן כתובת…" autocomplete="off" />
      <button class="icon-btn small" onclick="locateMe()" title="השתמש במיקומי"><span class="material-icons">my_location</span></button>
    </div>
    <div class="autocomplete-dropdown" id="fromDropdown"></div>

    <div class="search-divider">
      <div class="divider-line"></div>
      <button class="swap-btn" onclick="swapLocations()" title="Swap"><span class="material-icons">swap_vert</span></button>
    </div>

    <div class="search-row" id="toRow">
      <span class="dot dot-red"></span>
      <input type="text" id="toInput" class="search-input" placeholder="לאן? הזן יעד…" autocomplete="off" />
      <button class="icon-btn small" onclick="clearDestination()"><span class="material-icons">close</span></button>
    </div>
    <div class="autocomplete-dropdown" id="toDropdown"></div>
  </div>

  <div class="filter-row">
    <button class="filter-chip active" data-mode="all" onclick="filterMode(this,'all')">
      <span class="material-icons">directions</span> הכל
    </button>
    <button class="filter-chip" data-mode="driving" onclick="filterMode(this,'driving')">
      <span class="material-icons">directions_car</span> נהיגה
    </button>
    <button class="filter-chip" data-mode="walking" onclick="filterMode(this,'walking')">
      <span class="material-icons">directions_walk</span> הליכה
    </button>
    <button class="filter-chip" data-mode="cycling" onclick="filterMode(this,'cycling')">
      <span class="material-icons">directions_bike</span> אופניים
    </button>
    <button class="filter-chip" data-mode="train" onclick="filterMode(this,'train')">
      <span class="material-icons">directions_railway</span> רכבת
    </button>
    <button class="filter-chip" data-mode="tram" onclick="filterMode(this,'tram')">
      <span class="material-icons">tram</span> רכבת קלה
    </button>
    <button class="filter-chip" data-mode="bus" onclick="filterMode(this,'bus')">
      <span class="material-icons">directions_bus</span> אוטובוס
    </button>
    <button class="filter-chip" data-mode="taxi" onclick="filterMode(this,'taxi')">
      <span class="material-icons">local_taxi</span> מונית
    </button>
  </div>

  <div class="depart-row">
    <button class="depart-chip active" onclick="setDepart(this,'now')">יציאה עכשיו</button>
    <button class="depart-chip" onclick="setDepart(this,'later')">יציאה מאוחרת יותר</button>
    <input type="datetime-local" id="departTime" class="depart-time-input" style="display:none" />
  </div>

  <button class="search-btn" id="searchBtn" onclick="searchRoutes()">
    <span class="material-icons">search</span> חפש מסלול
  </button>
</div>

<!-- ═══════════════════════════ MAP ════════════════════════════════ -->
<div id="map"></div>

<!-- ══════════════════════════ RESULTS PANEL ══════════════════════ -->
<div class="results-panel" id="resultsPanel">
  <div class="results-handle" onclick="toggleResults()"></div>

  <div class="results-header">
    <div>
      <div class="results-title">המסלולים הטובים ביותר</div>
      <div class="results-meta">
        <span class="material-icons small-icon">access_time</span>
        <span id="departLabel">יציאה עכשיו</span> · <span id="currentTime"></span>
      </div>
    </div>
    <button class="icon-btn" onclick="toggleResults()">
      <span class="material-icons" id="panelArrow">expand_more</span>
    </button>
  </div>

  <div class="routes-list" id="routesList"></div>
</div>

<!-- ══════════════════════════ BOTTOM NAV ═════════════════════════ -->
<nav class="bottom-nav">
  <button class="nav-item active" onclick="setNav(this, 'map')">
    <span class="material-icons">map</span>
    <span>מפה</span>
  </button>
  <button class="nav-item" onclick="setNav(this, 'lines')">
    <span class="material-icons">directions_transit</span>
    <span>קווים</span>
  </button>
  <button class="nav-item" onclick="setNav(this, 'favorites')">
    <span class="material-icons">star_border</span>
    <span>מועדפים</span>
  </button>
  <button class="nav-item" onclick="setNav(this, 'alerts')">
    <span class="material-icons">warning_amber</span>
    <span>התראות</span>
  </button>
  <button class="nav-item" onclick="setNav(this, 'more')">
    <span class="material-icons">menu</span>
    <span>עוד</span>
  </button>
</nav>

<!-- ══════════════════════════ ROUTE DETAIL MODAL ════════════════ -->
<div class="modal-overlay" id="routeModal" onclick="closeModal(event)">
  <div class="modal-card" id="modalCard">
    <div class="modal-header">
      <h2 id="modalTitle">Route Details</h2>
      <button class="icon-btn" onclick="closeModal()"><span class="material-icons">close</span></button>
    </div>
    <div id="modalBody"></div>
    <div class="modal-footer">
      <button class="go-btn" onclick="startNavigation()">
        <span class="material-icons">navigation</span> התחל ניווט
      </button>
    </div>
  </div>
</div>

<!-- ══════════════════════════ LOCATION INFO POPUP ════════════════ -->
<div class="stop-popup" id="stopPopup">
  <div class="stop-popup-header">
    <span class="material-icons" id="stopIcon">place</span>
    <div>
      <div class="stop-name" id="stopName">Location</div>
      <div class="stop-meta" id="stopMeta">Tap map for details</div>
    </div>
    <button class="icon-btn small" onclick="closeStopPopup()"><span class="material-icons">close</span></button>
  </div>
  <div class="arrivals-list" id="arrivalsList"></div>
</div>

<script src="app.js"></script>
</body>
</html>
